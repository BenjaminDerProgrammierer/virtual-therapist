[from-epvpn]
exten => s,1,Answer()
 same => n,Set(call_source=epvpn)
 same => n,Goto(mainmenu,s,1)

[mainmenu]
exten => s,1,Wait(0.5)
 same => n,AGI(pipertts.agi, "hamster therapy", en_US-lessac-medium, any)
 same => n,WaitExten(1)
 same => n,GotoIf($[${call_source} = space]?skipspace)
   same => n,AGI(pipertts.agi,"Press one to call human representative", en_US-lessac-medium, any)
   same => n,WaitExten(0.5)
 same => n(skipspace),NoOp()
 same => n,AGI(pipertts.agi,"Press two to call doctor snickers", en_US-lessac-medium, any)
 same => n,WaitExten(0.5)

 same => n,WaitExten(10)

exten => t,1,AGI(pipertts.agi,"timed out - call again", en_US-lessac-medium, any)
 same => n,Hangup()

exten => i,1,Goto(s,1)

exten => 1,1,Dial(PJSIP/40201,20)
exten => 2,1,AGI(pipertts.agi,"Speak to Doctor Snickers now. Press hash when you are done.",en_US-lessac-medium)
 same => n,Set(EAGI_AUDIO_FORMAT=slin16)
 same => n,Set(HAMSTER_AI_STATUS=failed)
 same => n,EAGI(hamster_whisper.py)
 same => n,GotoIf($["${HAMSTER_AI_STATUS}"="success"]?done)
 same => n,GotoIf($["${HAMSTER_AI_STATUS}"="no-speech"]?nospeech)
 same => n,AGI(pipertts.agi,"Doctor Snickers is taking a nap. Please try again later.",en_US-lessac-medium)
 same => n,Goto(done)
 same => n(nospeech),AGI(pipertts.agi,"Doctor Snickers could not hear you.",en_US-lessac-medium)
 same => n(done),Goto(mainmenu,s,1)

[hamster-bridge]
exten => s,1,Dial(PJSIP/40202,20)
 same => n,Hangup()

[hamster-playback]
exten => s,1,NoOp(Playing AI speech through bridged talk-back hamster)
 same => n,MixMonitor(${HAMSTER_MONITOR}.wav,r(${HAMSTER_RESULT}.wav))
 same => n,Playback(${HAMSTER_SEND})
 same => n,Wait(${HAMSTER_WAIT})
 same => n,StopMixMonitor()
 same => n,Hangup()
